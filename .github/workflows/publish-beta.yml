name: Publish signed Lumia Launcher beta

on:
  workflow_run:
    workflows: ["Lumia Launcher Android CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: beta-release-main
  # CI runs can complete out of commit order; keep pending releases for the SHA guard.
  queue: max
  cancel-in-progress: false

jobs:
  publish-beta:
    # Explicit opt-in: never publish from an ephemeral debug signing key.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          vars.BETA_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      KEYSTORE_PATH: /tmp/lumia-beta-upload.jks
    steps:
      - name: Checkout exact CI-tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true

      - name: Verify commit and reserve unique release identity
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote --heads origin main | cut -f1)"
          SOURCE_STATUS="$(bash scripts/beta-release-source-status.sh "$SOURCE_SHA" "$(git rev-parse HEAD)" "$MAIN_SHA")"
          if [ "$SOURCE_STATUS" = stale ]; then
            echo "::notice::main advanced since CI; safely skipping superseded beta release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          SHORT_SHA="$(printf '%s' "$SOURCE_SHA" | cut -c1-12)"
          TAG="v1.1.0-beta.$CI_RUN_NUMBER-g$SHORT_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release/tag $TAG already exists; refusing overwrite."
            exit 1
          fi
          echo "BETA_TAG=$TAG" >> "$GITHUB_ENV"
          echo "BETA_VERSION_CODE=$((100000 + CI_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "BETA_VERSION_NAME=1.1.0-beta.$CI_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        if: steps.release_guard.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        if: steps.release_guard.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Restore persistent release signing identity
        if: steps.release_guard.outputs.ready == 'true'
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
          BETA_CERT_SHA256: ${{ secrets.BETA_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BETA_KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_PASSWORD" "$BETA_CERT_SHA256"; do
            if [ -z "$value" ]; then
              echo "::error::Missing beta signing secret; see docs/beta-release.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          # Check the persistent certificate before spending time on Gradle or publishing.
          bash scripts/verify-beta-keystore.sh "$KEYSTORE_PATH" "$BETA_CERT_SHA256"

      - name: Build signed release APK for exact CI commit
        if: steps.release_guard.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify signing identity and prepare checksum
        if: steps.release_guard.outputs.ready == 'true'
        env:
          BETA_CERT_SHA256: ${{ secrets.BETA_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK" && test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          bash scripts/verify-beta-signature.sh "$APK" "$BETA_CERT_SHA256" "$APKSIGNER"
          mkdir -p dist
          APK_NAME="Lumia-Launcher-$BETA_TAG.apk"
          cp "$APK" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          rm -f "$KEYSTORE_PATH"

      - name: Verify in-place beta upgrade lineage against last published beta
        if: steps.release_guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_CERT_SHA256: ${{ secrets.BETA_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(gh release list --limit 100 --json tagName,isPrerelease,publishedAt --jq '[.[] | select(.isPrerelease and (.tagName | startswith("v1.1.0-beta.")))] | sort_by(.publishedAt) | last | .tagName // ""')"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "::notice::No previous beta found; in-place upgrade lineage is not yet established."
            exit 0
          fi
          PREVIOUS_DIR="$(mktemp -d)"
          trap 'rm -rf "$PREVIOUS_DIR"' EXIT
          gh release download "$PREVIOUS_TAG" --pattern '*.apk' --dir "$PREVIOUS_DIR"
          COUNT="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Previous beta must contain exactly one APK; refusing unverified upgrade."
            exit 1
          fi
          PREVIOUS_APK="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          NEW_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$NEW_APK" && test -n "$APKSIGNER" && test -n "$AAPT"
          bash scripts/verify-beta-upgrade-lineage.sh "$PREVIOUS_APK" "$NEW_APK" "$BETA_CERT_SHA256" "$APKSIGNER" "$AAPT"

      - name: Upload verified APK artifact
        if: steps.release_guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumia-beta-${{ github.event.workflow_run.run_number }}
          path: dist/*.apk*
          retention-days: 30

      - name: Publish immutable GitHub beta pre-release
        if: steps.release_guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote --heads origin main | cut -f1)"
          SOURCE_STATUS="$(bash scripts/beta-release-source-status.sh "$SOURCE_SHA" "$(git rev-parse HEAD)" "$MAIN_SHA")"
          if [ "$SOURCE_STATUS" = stale ]; then
            echo "::notice::main advanced during build; safely skipping superseded beta publishing."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$BETA_TAG" >/dev/null 2>&1 || gh release view "$BETA_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing overwrite."
            exit 1
          fi
          {
            echo "Beta built from CI-tested main commit \`$SOURCE_SHA\`."
            echo
            echo "- Change: $(git log -1 --format=%s)"
            echo "- CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
            echo "- SHA-256 checksum attached."
            echo "- Signing: persistent release identity, verified against expected fingerprint."
            echo "- Earlier debug-signed beta APKs may not accept an in-place update. Back up data before any manual migration; never uninstall automatically."
          } > dist/RELEASE_NOTES.md
          gh release create "$BETA_TAG" "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$SOURCE_SHA" \
            --title "Lumia Launcher $BETA_VERSION_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease
