name: AI Code Review (Widget-first)
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify Gemini key configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Configure repository Actions secret GEMINI_API_KEY first."
            exit 1
          fi
      - name: Review diff with Gemini and create GitHub Issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ai_review.py
