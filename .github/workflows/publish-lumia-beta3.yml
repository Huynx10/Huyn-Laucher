name: Publish Lumia Launcher Beta 3 Test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/v1.1.0-beta3-s24-20261023.request'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Refuse to replace an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.0-beta3 >/dev/null 2>&1; then
            echo '::error::Tag v1.1.0-beta3 already exists; refusing to overwrite it.'
            exit 1
          fi
          if gh release view v1.1.0-beta3 >/dev/null 2>&1; then
            echo '::error::Release v1.1.0-beta3 already exists; refusing to overwrite it.'
            exit 1
          fi
      - name: Unit and Robolectric tests
        run: gradle :app:testDebugUnitTest
      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Prepare APK and SHA-256 checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Lumia-Launcher-v1.1.0-beta3-S24Ultra-debug.apk
          cd dist
          sha256sum Lumia-Launcher-v1.1.0-beta3-S24Ultra-debug.apk > Lumia-Launcher-v1.1.0-beta3-S24Ultra-debug.apk.sha256
      - name: Keep artifact available when Release permissions are blocked
        uses: actions/upload-artifact@v4
        with:
          name: lumia-launcher-beta3-s24-ultra
          path: dist/*
          retention-days: 30
      - name: Publish pre-release with exact build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0-beta3 \
            dist/Lumia-Launcher-v1.1.0-beta3-S24Ultra-debug.apk \
            dist/Lumia-Launcher-v1.1.0-beta3-S24Ultra-debug.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title 'Lumia Launcher 1.1.0 beta 3 - S24 Ultra test' \
            --notes-file .github/release-requests/v1.1.0-beta3-s24-20261023.request \
            --prerelease
