name: Huyn Launcher F2 Grid folder internal debug preview 2026-11-06
on:
  push:
    branches: [ "fix/f2-app-over-app-20261106" ]
permissions:
  contents: read
jobs:
  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Existing release signing and persistence regression guards
        run: |
          bash scripts/test-verify-beta-signature.sh
          bash scripts/test-verify-beta-keystore.sh
          bash scripts/test-beta-upgrade-lineage.sh
          bash scripts/test-beta-release-source-status.sh
          bash scripts/test-page-persistence-guard.sh
          bash scripts/test-tile-style-atomic-save.sh
      - name: Android lint
        run: gradle :app:lintDebug
      - name: JVM and Robolectric tests
        run: gradle :app:testDebugUnitTest
      - name: Generate disposable INTERNAL debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Assemble internal debug APK
        run: gradle :app:assembleDebug
      - name: Verify internal-only application identity and record SHA
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > /tmp/internal-badging.txt
          grep -Fq "package: name='com.aistudio.lumialauncher.wp10m.p1b1'" /tmp/internal-badging.txt
          grep -Fq "versionName='1.1.0-beta3-p1b1-internal'" /tmp/internal-badging.txt
          grep -Fq "application-label:'Lumia P1-B1 (internal)'" /tmp/internal-badging.txt
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA" > internal-build-provenance.txt
          printf "F2_BASE_PREVIEW_SHA=999efcd18c4b3dfd87f4825cc0114b2ed5bd0b70\nBUILD_KIND=INTERNAL_DEBUG_NOT_BETA\n" >> internal-build-provenance.txt
          sha256sum "$APK" | tee -a internal-build-provenance.txt
      - name: Upload INTERNAL debug APK and checksum (not beta release)
        uses: actions/upload-artifact@v4
        with:
          name: huyn-f2-grid-preview-20261106
          path: |
            app/build/outputs/apk/debug/*.apk
            internal-build-provenance.txt
          if-no-files-found: error
          retention-days: 7
