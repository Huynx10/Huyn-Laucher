name: Lumia Launcher Android CI

on:
  push:
    branches: [ "main", "master", "develop", "beta/**", "fix/**" ]
  pull_request:
    branches: [ "main", "master", "develop", "beta/**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Release signing regression checks
        run: |
          bash scripts/test-verify-beta-signature.sh
          bash scripts/test-verify-beta-keystore.sh
          bash scripts/test-beta-upgrade-lineage.sh
          bash scripts/test-beta-release-source-status.sh
          bash scripts/test-page-persistence-guard.sh
          bash scripts/test-tile-style-atomic-save.sh

      - name: Android Lint (API compatibility)
        run: gradle :app:lintDebug

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug

      - name: Verify isolated trial package
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/lumia-trial-badging.txt
          grep -Fq "package: name='com.aistudio.lumialauncher.wp10m.trial2'" /tmp/lumia-trial-badging.txt
          sha256sum "$APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumia-launcher-s24-trial-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
