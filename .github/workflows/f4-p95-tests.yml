name: F4 p95 candidate tests
on:
  pull_request:
    paths:
      - 'tools/f4-p95-pilot/**'
      - '.github/workflows/f4-p95-tests.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/f4-p95-pilot/*.test.mjs
